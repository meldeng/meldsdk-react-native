// React Native library module. AGP and the Kotlin plugin come from the host app's classpath
// (RN apps are Kotlin-based), so this module declares no buildscript of its own. The host app
// must expose the Maven repository that serves `io.meld:meldsdk` — see the README.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }

android {
    namespace "io.meld.rn"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Version supplied by the host app's React Native Gradle plugin.
    implementation "com.facebook.react:react-android"
    // The native Meld SDK this wraps (kept in lockstep). Resolved from JitPack/Maven by the app.
    implementation "io.meld:meldsdk:0.4.0"
}
